function reset(){clearInterval(timer);left=60;running=false;finished=false;input.value="";$("time").textContent=60;$("wpm").textContent=0;$("acc").textContent="100%";$("err").textContent=0;$("prog").style.width="0";$("result").textContent="";draw();input.focus()}
input.addEventListener("input",()=>{start();draw();calc();if(input.value.length>=txt().length)finish(true)});
$("restart").onclick=reset;$("other").onclick=()=>{index=(index+1)%25;localStorage.setItem("kt_i_"+level,index);reset()};$("next").onclick=()=>setLevel(level===4?1:level+1);
function setLevel(n){level=n;document.querySelectorAll(".lvl").forEach(x=>x.classList.toggle("on",Number(x.dataset.l)===n));load();reset()} document.querySelectorAll(".lvl").forEach(x=>x.onclick=()=>setLevel(Number(x.dataset.l)));
load();drawHistory();
if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
